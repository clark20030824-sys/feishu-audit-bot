services:
  - type: web
    name: feishu-audit-bot
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: PORT
        value: "3000"
      - key: CALLBACK_PATH
        value: /feishu/event
      - key: LLM_API_BASE
        value: https://api.siliconflow.cn/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: AUDITOR_OPEN_ID
        sync: false
